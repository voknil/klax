name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - run: go build ./cmd/klax
      - name: Cross-compile darwin
        run: |
          GOOS=darwin GOARCH=arm64 go build ./cmd/klax
          GOOS=darwin GOARCH=amd64 go build ./cmd/klax
      - run: go vet ./...
      - run: go test ./...

      # The SPA has no toolchain and no dependencies: node's own runner covers the pure modules
      # (scope/selection), and --check parses every module so a syntax error cannot reach a release.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: node --test cmd/klax/ui_static/*.test.mjs

      - run: for f in cmd/klax/ui_static/*.js; do node --check "$f"; done

  # The darwin-only files (installer, launchd service, pty) are cross-compiled
  # above but their tests only build on a mac, so they need a mac runner.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - run: go vet ./...
      - run: go test ./...
